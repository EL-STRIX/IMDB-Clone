<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5c518" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="600" fill="url(#bgGradient)" />
  <rect x="10" y="10" width="380" height="580" fill="none" stroke="#27272a" stroke-width="2" rx="8" />

  <!-- Film Clapperboard / Reel Icon -->
  <g transform="translate(136, 210)" fill="none" stroke="url(#accentGradient)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer Clapper Frame -->
    <rect x="0" y="24" width="128" height="96" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="3" />
    
    <!-- Top Clapper Bar with Diagonal Stripes -->
    <g transform="rotate(-10 0 24)">
      <rect x="0" y="0" width="128" height="24" rx="4" fill="#27272a" stroke="#f5c518" stroke-width="2" />
      <line x1="24" y1="0" x2="12" y2="24" stroke="#f5c518" stroke-width="3" />
      <line x1="56" y1="0" x2="44" y2="24" stroke="#f5c518" stroke-width="3" />
      <line x1="88" y1="0" x2="76" y2="24" stroke="#f5c518" stroke-width="3" />
      <line x1="120" y1="0" x2="108" y2="24" stroke="#f5c518" stroke-width="3" />
    </g>

    <!-- Center Play / Star Icon -->
    <polygon points="56,56 80,72 56,88" fill="url(#accentGradient)" stroke="none" />
  </g>

  <!-- Text -->
  <text x="200" y="380" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" fill="#f4f4f5">
    No Poster Available
  </text>
  <text x="200" y="410" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#71717a">
    IMDb Clone
  </text>
</svg>
